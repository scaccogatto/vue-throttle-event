version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on TypeScript 6 until TS 7.1 and typescript-eslint, vue-tsc and
      # api-extractor support it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
